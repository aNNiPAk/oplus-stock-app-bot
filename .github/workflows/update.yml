name: Update OPlus stock apps

on:
  workflow_call:
    inputs:
      inventory_model:
        required: false
        type: string
        default: ""
      inventory_region:
        required: false
        type: string
        default: ""
      inventory_partitions:
        required: false
        type: string
        default: ""
      inventory:
        required: false
        type: boolean
        default: false
      app_repository:
        required: false
        type: string
        default: ""
      allow_publication:
        description: Allow publication from an explicitly configured caller workflow
        required: false
        type: boolean
        default: false
      ota_url_override:
        required: false
        type: string
        default: ""
      dry_run:
        required: false
        type: boolean
        default: true
    secrets:
      RELEASE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ota_url_override:
        description: "Optional direct full OTA URL. Leave empty for automatic catalog lookup."
        required: false
        type: string
      dry_run:
        description: "Extract and compare, but do not publish releases."
        required: false
        default: true
        type: boolean

concurrency:
  group: oplus-stock-app-${{ inputs.app_repository || inputs.inventory_model || github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: aNNiPAk/oplus-stock-app-bot
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run regression tests
        run: |
          python -m pip install "android-payload-dumper==2.3.0"
          python -m unittest discover -s tests -v

      - name: Install Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            erofs-utils \
            e2fsprogs \
            android-sdk-libsparse-utils \
            file \
            jq
          python -m pip install --upgrade pip
          python -m pip install "android-payload-dumper==2.3.0"

      - name: Run updater
        env:
          APP_REPOSITORY: ${{ inputs.app_repository || (github.repository == 'aNNiPAk/oplus-stock-app-bot' && 'oplus-calendar') }}
          INVENTORY_MODEL: ${{ inputs.inventory_model }}
          INVENTORY_REGION: ${{ inputs.inventory_region }}
          INVENTORY_PARTITIONS: ${{ inputs.inventory_partitions }}
          INVENTORY: ${{ inputs.inventory || 'false' }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TARGET_OWNER: ${{ vars.TARGET_OWNER || github.repository_owner }}
          OTA_URL_OVERRIDE: ${{ inputs.ota_url_override }}
          DRY_RUN: ${{ inputs.dry_run || (github.event_name == 'push' && !inputs.allow_publication) || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/oplus_release_bot.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oplus-stock-app-report
          path: .work/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload extracted APK for review
        if: always() && (github.event_name == 'push' || inputs.dry_run)
        uses: actions/upload-artifact@v4
        with:
          name: oplus-stock-app-dry-run-apk
          path: .work/staged/*.apk
          if-no-files-found: ignore
          retention-days: 7
